name: 🚀 Deploy PROD Stage calendar-wp-plugin

on:
  workflow_run:
    workflows: ['🧪 CI calendar-wp-plugin']
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  web-deploy:
    name: 🎉 Deploy at https://erfindergeist.org/
    runs-on: ubuntu-latest
    # Nur eigene Pushes deployen – CI-Läufe aus (Fork-)PRs dürfen nicht an die FTP-Secrets.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: 🐘 PHP & Composer einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - name: 📦 Produktions-Abhängigkeiten installieren
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: 📂 Sync files
        uses: ./.github/actions/ftp-deploy
        with:
          username: ${{ secrets.FTP_USERNAME_PROD }}
          password: ${{ secrets.FTP_PASSWORD_PROD }}
